[project]
name = "amelia-ai-manager"
version = "0.1.0"
description = "AI Telegram manager for Amelia Flowers"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.36.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "gspread>=6.1.0",
  "fastapi>=0.141.1",
  "jinja2>=3.1.6",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amelia_manager"]
artifacts = ["src/amelia_manager/web/templates/*.html", "src/amelia_manager/web/static/*"]

[tool.hatch.build.targets.wheel.force-include]
"src/amelia_manager/web/templates" = "amelia_manager/web/templates"
"src/amelia_manager/web/static" = "amelia_manager/web/static"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["F"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
