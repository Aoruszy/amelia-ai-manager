<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} · Amelia Admin</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <nav>
      <a class="brand" href="/">Amelia Admin</a>
      <div class="nav-links">
        <a href="/" class="{{ 'active' if nav_active|default('') == 'dialogues' else '' }}">Диалоги</a>
        <a href="/catalog" class="{{ 'active' if nav_active|default('') == 'catalog' else '' }}">Ассортимент</a>
        <a href="/metrics" class="{{ 'active' if nav_active|default('') == 'metrics' else '' }}">Метрики</a>
        <button id="theme-toggle" class="secondary" type="button" aria-label="Переключить тему">Тема</button>
      </div>
    </nav>
  </header>
  <main class="container">
    {% if error %}<div class="error-banner" role="alert">{{ error }}</div>{% endif %}
    {% block body %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
