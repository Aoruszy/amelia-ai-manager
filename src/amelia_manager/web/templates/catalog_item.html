{% extends "base.html" %}
{% block body %}
<section class="page-title">
  <div>
    <h1>{{ item.name }}</h1>
    <p>Обновлено: {{ format_time(item.updated_at) }}</p>
  </div>
  <a href="/catalog">← Ассортимент</a>
</section>

<section class="panel">
  <form method="post" action="/catalog/items/{{ item.id }}">
    <label>Название<input name="name" value="{{ item.name }}" required></label>
    <label>Количество<input name="quantity_number" inputmode="numeric" value="{{ item.quantity_number if item.quantity_number is not none else '' }}"></label>
    <label>Цена, ₽<input name="price" inputmode="numeric" value="{{ item.price if item.price is not none else '' }}"></label>
    <label>Единица<input name="unit" value="{{ item.unit or 'шт' }}"></label>
    <label>Показывать в каталоге
      <select name="is_active">
        <option value="1" {% if item.is_active %}selected{% endif %}>Да</option>
        <option value="0" {% if not item.is_active %}selected{% endif %}>Нет</option>
      </select>
    </label>
    <button type="submit">Сохранить</button>
  </form>
</section>

<section class="panel" style="margin-top:1rem">
  <h2>Убрать из выдачи</h2>
  <p class="muted-text">Позиция останется в базе, но бот перестанет её предлагать.</p>
  <form method="post" action="/catalog/items/{{ item.id }}/hide">
    <button type="submit" class="secondary">Скрыть из каталога</button>
  </form>
</section>
{% endblock %}
